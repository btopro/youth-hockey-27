content: >-
  <p>Every penalty in the game comes from the USA Hockey rulebook. When the ref
  calls one, the game stops for a moment to show the ref's signal and explain
  the rule.</p>

  <table>

  <thead><tr><th scope="col">Penalty</th><th scope="col">The rule</th><th
  scope="col">How it happens in the game</th></tr></thead>

  <tbody>

  <tr><td>Tripping</td><td>Using your stick, knee or foot to make another player
  fall.</td><td>Stick play on the puck carrier.</td></tr>

  <tr><td>Hooking</td><td>Using the blade of your stick to pull or hold back
  another player.</td><td>Stick play on the puck carrier.</td></tr>

  <tr><td>Slashing</td><td>Swinging your stick at another player, even if you
  only hit their stick or gloves.</td><td>Stick play, and once in a while a poke
  check.</td></tr>

  <tr><td>Holding</td><td>Grabbing another player or their stick to slow them
  down.</td><td>Stick play, on or off the puck.</td></tr>

  <tr><td>Interference</td><td>Hitting, holding or blocking a player who does
  not have the puck.</td><td>A check or stick play on someone without the
  puck.</td></tr>

  <tr><td>High-sticking</td><td>Carrying your stick above your shoulders and
  making contact with another player.</td><td>Stick play.</td></tr>

  <tr><td>Cross-checking</td><td>Hitting another player with the shaft of your
  stick held in both hands.</td><td>A body check from behind.</td></tr>

  <tr><td>Roughing</td><td>Extra pushing, shoving or punching, usually after the
  whistle.</td><td>An occasional rough body check.</td></tr>

  <tr><td>Body checking</td><td>Body checking is not allowed until 14U. Younger
  players learn body contact and angling first, so they are ready for
  it.</td><td>Any body check below 14U.</td></tr>

  <tr><td>Fighting</td><td>Dropping the gloves earns a game
  misconduct.</td><td>AAA &amp; Beer League only. Both fighters are ejected, and
  when a team runs out of players the game is called.</td></tr>

  </tbody>

  </table>

  <h2>Calls, delays and power plays</h2>

  <ul>

  <li><strong>Delayed penalties</strong>: the ref raises an arm and waits until
  the team that committed the penalty touches the puck.</li>

  <li><strong>Power plays</strong>: a minor is two minutes in the box, and a
  power play goal ends it early.</li>

  <li><strong>Offsides and icing</strong> are called on full ice from 14U up,
  and never on roller.</li>

  <li><strong>Ref strictness</strong>: the slider on the setup screen scales
  every call. Jay mode turns penalties off entirely.</li>

  </ul>

  <h2>The rulebook</h2>

  <ul>

